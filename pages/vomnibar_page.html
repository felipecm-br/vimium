<!DOCTYPE html>
<html>

<head>
  <title>Vomnibar</title>
  <meta name="color-scheme" content="light dark">
  <meta charset="UTF-8">
  <script type="module" src="vomnibar_page.js"></script>
  <link rel="stylesheet" type="text/css" href="../content_scripts/vimium.css" />
  <link rel="stylesheet" type="text/css" href="vomnibar_page.css" />
</head>

<body>
  <div id="vomnibar">
    <div id="vomnibar-search-area">
      <span class="search-icon"></span>
      <input type="text" autocomplete="off" placeholder="Search tabs, bookmarks, history...">
      <span id="vomnibar-position-indicator"></span>
    </div>
    <ul></ul>
    <div id="vomnibar-keystrokes">
      <span class="keystroke-item"><kbd>↑↓</kbd> Navigate</span>
      <span class="keystroke-item"><kbd>Enter</kbd> Open</span>
      <span class="keystroke-item"><kbd>⇧Enter</kbd> New tab</span>
      <span class="keystroke-item"><kbd>y</kbd> Yank title</span>
      <span class="keystroke-item"><kbd>Y</kbd> Yank URL</span>
      <span class="keystroke-item"><kbd>Esc</kbd> Close</span>
    </div>
  </div>
</body>

</html>
