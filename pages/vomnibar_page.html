<!DOCTYPE html>
<html>

<head>
  <title>Vomnibar</title>
  <meta name="color-scheme" content="light dark">
  <meta charset="UTF-8">
  <script type="module" src="vomnibar_page.js"></script>
  <link rel="stylesheet" type="text/css" href="../content_scripts/vimium.css" />
  <link rel="stylesheet" type="text/css" href="vomnibar_page.css" />
  <link rel="stylesheet" type="text/css" href="./key_mappings.css" />
</head>

<body>
  <div id="vomnibar">
    <div id="vomnibar-search-area">
      <span class="search-icon material-symbols-outlined" aria-hidden="true">search</span>
      <div id="vomnibar-input-wrap">
        <input type="text" autocomplete="off" placeholder="Search tabs, bookmarks, history..."
          role="combobox" aria-label="Search" aria-autocomplete="list" aria-expanded="false"
          aria-controls="vomnibar-results">
        <div id="vomnibar-ghost" aria-hidden="true"><span class="typed"></span><span class="rest"></span></div>
      </div>
      <span id="vomnibar-position-indicator"></span>
    </div>
    <ul id="vomnibar-results" role="listbox" aria-label="Results"></ul>
    <div id="vomnibar-theme-footer"></div>
    <div id="vomnibar-status" role="status"></div>
  </div>
</body>

</html>
